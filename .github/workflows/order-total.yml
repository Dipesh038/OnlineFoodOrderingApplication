name: Order total example

on:
  push:
    branches: [main]

jobs:
  calculate-order:
    runs-on: ubuntu-latest
    steps:
      - name: Get the project files
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Calculate a sample order
        run: python feature_cart.py
      - name: Run order tests
        run: |
          python -m pip install pytest
          python -m pytest -q test_feature_cart.py
